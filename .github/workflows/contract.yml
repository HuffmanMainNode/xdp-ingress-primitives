name: Contract, rules, tests, and BPF compile

on:
  push:
    paths:
      - 'CONTRACT.md'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'xdp_ingress.c'
      - 'xdp_rules.py'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'CONTRACT.md'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'xdp_ingress.c'
      - 'xdp_rules.py'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical contract and compatibility schema copies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CONTRACT.md)" = "cd04d1046df036894a5b68796fdc007d4ab7cc82"
          test "$(git hash-object schemas/compatibility.schema.json)" = "e565766ca037479c441ce21dd866fbb8209d7615"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run deterministic rule tests
        run: python -m unittest discover -v
      - name: Validate compatibility and ingress rule schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          for schema_path in [
              "schemas/compatibility.schema.json",
              "schemas/ingress-rules.schema.json",
          ]:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
          compatibility = json.loads(Path("COMPATIBILITY.json").read_text(encoding="utf-8"))
          compatibility_schema = json.loads(Path("schemas/compatibility.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator(
              compatibility_schema, format_checker=FormatChecker()
          ).validate(compatibility)
          print("TIER-1: compatibility and ingress rule schemas validated.")
          PY
      - name: Compile BPF object without loading or attaching
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          clang --version
          make clean
          make
          readelf -SW xdp_ingress.o | tee /tmp/xdp-sections.txt
          grep -Eq ' xdp ' /tmp/xdp-sections.txt
          grep -Eq ' \.maps ' /tmp/xdp-sections.txt
          grep -Eq ' license ' /tmp/xdp-sections.txt
          readelf -sW xdp_ingress.o | grep cas_xdp_ingress

  kernel-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIN_DIR: /sys/fs/bpf/cas-xdp-ci-${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          command -v bpftool
          bpftool version
      - name: Build BPF object
        run: |
          make clean
          make
      - name: Load into kernel verifier without interface attachment
        shell: bash
        run: |
          set -euo pipefail
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpf /sys/fs/bpf
            sudo touch /tmp/cas-xdp-bpffs-mounted-by-job
          fi
          sudo mkdir -p "$PIN_DIR/maps"
          sudo bpftool prog load xdp_ingress.o "$PIN_DIR/prog" type xdp pinmaps "$PIN_DIR/maps"
          sudo bpftool prog show pinned "$PIN_DIR/prog"
          sudo bpftool map show pinned "$PIN_DIR/maps/deny_src_ipv4"
      - name: Test explicit drop and default pass with BPF_PROG_TEST_RUN
        shell: bash
        run: |
          set -euo pipefail
          sudo bpftool map update pinned "$PIN_DIR/maps/deny_src_ipv4" key hex c6 33 64 0a value hex 01
          python3 - <<'PY'
          import ipaddress
          import struct
          from pathlib import Path

          def ipv4_frame(source):
              ethernet = bytes.fromhex("00112233445566778899aabb0800")
              header = struct.pack(
                  "!BBHHHBBH4s4s",
                  0x45, 0, 20, 1, 0, 64, 17, 0,
                  ipaddress.IPv4Address(source).packed,
                  ipaddress.IPv4Address("198.51.100.1").packed,
              )
              return ethernet + header

          Path("/tmp/xdp-drop.bin").write_bytes(ipv4_frame("198.51.100.10"))
          Path("/tmp/xdp-pass.bin").write_bytes(ipv4_frame("198.51.100.11"))
          vlan = bytes.fromhex("00112233445566778899aabb810000000800") + ipv4_frame("198.51.100.10")[14:]
          Path("/tmp/xdp-vlan.bin").write_bytes(vlan)
          Path("/tmp/xdp-truncated.bin").write_bytes(bytes.fromhex("001122334455"))
          PY

          run_test() {
            local input_file="$1"
            local expected="$2"
            local output
            output=$(sudo bpftool prog run pinned "$PIN_DIR/prog" data_in "$input_file" data_out /tmp/xdp-data-out.bin repeat 1)
            printf '%s\n' "$output"
            grep -Eq "retval ${expected}([[:space:]]|$)" <<<"$output"
          }
          run_test /tmp/xdp-drop.bin 1
          run_test /tmp/xdp-pass.bin 2
          run_test /tmp/xdp-vlan.bin 2
          run_test /tmp/xdp-truncated.bin 2
      - name: Remove pinned test program and maps
        if: always()
        shell: bash
        run: |
          sudo rm -rf "$PIN_DIR"
          if [ -f /tmp/cas-xdp-bpffs-mounted-by-job ]; then
            sudo umount /sys/fs/bpf
            rm -f /tmp/cas-xdp-bpffs-mounted-by-job
          fi
