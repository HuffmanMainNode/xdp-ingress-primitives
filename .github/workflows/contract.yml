name: Contract, rules, tests, and BPF compile

on:
  push:
    paths:
      - 'CONTRACT.md'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'xdp_ingress.c'
      - 'xdp_rules.py'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'CONTRACT.md'
      - 'COMPATIBILITY.json'
      - 'schemas/**'
      - 'xdp_ingress.c'
      - 'xdp_rules.py'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify canonical contract and compatibility schema copies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CONTRACT.md)" = "cd04d1046df036894a5b68796fdc007d4ab7cc82"
          test "$(git hash-object schemas/compatibility.schema.json)" = "e565766ca037479c441ce21dd866fbb8209d7615"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run deterministic rule tests
        run: python -m unittest discover -v
      - name: Validate compatibility and ingress rule schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          for schema_path in [
              "schemas/compatibility.schema.json",
              "schemas/ingress-rules.schema.json",
          ]:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
          compatibility = json.loads(Path("COMPATIBILITY.json").read_text(encoding="utf-8"))
          compatibility_schema = json.loads(Path("schemas/compatibility.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator(
              compatibility_schema, format_checker=FormatChecker()
          ).validate(compatibility)
          print("TIER-1: compatibility and ingress rule schemas validated.")
          PY
      - name: Compile BPF object without loading or attaching
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          clang --version
          clang -target bpf -O2 -g -Wall -Werror -c xdp_ingress.c -o /tmp/xdp_ingress.o
          readelf -S /tmp/xdp_ingress.o | grep -E '\.xdp|\.maps|license'
